name: srm

x-shelly-build: &shelly-build
  context: ../PythonShelly
  dockerfile: Dockerfile

services:
  srm-sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    restart: unless-stopped
    env_file:
      - path: .runtime-env/srm-sqlserver.env
        format: raw
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U \"$${SQL_HEALTH_USERNAME}\" -P \"$${MSSQL_SA_PASSWORD}\" -C -Q \"SELECT 1\" || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s
    volumes: ["srm-sqlserver-data:/var/opt/mssql"]
    networks: [srm-shared]

  srm-redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    volumes: ["srm-redis-data:/data"]
    networks: [srm-shared]

  srm-redmine-db:
    image: postgres:16
    restart: unless-stopped
    env_file:
      - path: .runtime-env/srm-redmine-db.env
        format: raw
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 10s
      timeout: 5s
      retries: 20
    volumes: ["srm-redmine-db-data:/var/lib/postgresql/data"]
    networks: [srm-shared]

  srm-redmine:
    image: redmine:6.0
    restart: unless-stopped
    depends_on:
      srm-redmine-db:
        condition: service_healthy
    env_file:
      - path: .runtime-env/srm-redmine.env
        format: raw
    volumes: ["srm-redmine-data:/usr/src/redmine/files"]
    networks: [srm-shared]

  srm-auth:
    profiles: [apps]
    build:
      context: ..
      dockerfile: SRMAuth/Dockerfile
    image: srm-auth:local
    restart: unless-stopped
    depends_on:
      srm-sqlserver: { condition: service_healthy }
      srm-redis: { condition: service_healthy }
    env_file:
      - path: .runtime-env/srm-auth.env
        format: raw
    networks: [srm-shared]

  srm-core:
    profiles: [apps]
    build:
      context: ..
      dockerfile: SRMCore/Dockerfile
    image: srm-core:local
    restart: unless-stopped
    depends_on:
      srm-sqlserver: { condition: service_healthy }
      srm-redis: { condition: service_healthy }
      srm-redmine: { condition: service_started }
    env_file:
      - path: .runtime-env/srm-core.env
        format: raw
    networks: [srm-shared]

  srm-app:
    profiles: [apps]
    build:
      context: ..
      dockerfile: SRMApp/Dockerfile
    image: srm-app:local
    restart: unless-stopped
    depends_on: [srm-auth, srm-core]
    env_file:
      - path: .runtime-env/srm-app.env
        format: raw
    networks: [srm-shared]

  srm-agent:
    profiles: [apps]
    build:
      context: ..
      dockerfile: SRMAgent/Dockerfile
    image: srm-agent:local
    restart: unless-stopped
    depends_on: [srm-auth, srm-core]
    env_file:
      - path: .runtime-env/srm-agent.env
        format: raw
    networks: [srm-shared]

  shelly1:
    profiles: [simulators]
    build: *shelly-build
    image: srm-shelly:local
    restart: unless-stopped
    networks: [srm-shared]

  shelly2:
    profiles: [simulators]
    image: srm-shelly:local
    restart: unless-stopped
    networks: [srm-shared]

  shelly3:
    profiles: [simulators]
    image: srm-shelly:local
    restart: unless-stopped
    networks: [srm-shared]

volumes:
  srm-sqlserver-data:
  srm-redis-data:
  srm-redmine-db-data:
  srm-redmine-data:

networks:
  srm-shared: {}
