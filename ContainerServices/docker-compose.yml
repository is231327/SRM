name: srm

x-shelly-build: &shelly-build
  context: ../PythonShelly
  dockerfile: Dockerfile

x-dotnet-healthcheck: &dotnet-healthcheck
  test: ["CMD", "/usr/bin/bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/8080 && printf 'GET /health HTTP/1.0\\r\\nHost: localhost\\r\\n\\r\\n' >&3 && grep -q '200 OK' <&3"]
  interval: 5s
  timeout: 3s
  retries: 20
  start_period: 10s

services:
  srm-sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    restart: unless-stopped
    env_file:
      - path: .runtime-env/srm-sqlserver.env
        format: raw
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U \"$${SQL_HEALTH_USERNAME}\" -P \"$${MSSQL_SA_PASSWORD}\" -C -Q \"SELECT 1\" || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s
    volumes: ["srm-sqlserver-data:/var/opt/mssql"]
    networks: [srm-data]

  srm-redis:
    image: redis:7-alpine
    restart: unless-stopped
    env_file:
      - path: .runtime-env/srm-redis.env
        format: raw
    command: ["/bin/sh", "-c", "exec redis-server --appendonly yes --requirepass \"$$REDIS_PASSWORD\""]
    healthcheck:
      test: ["CMD-SHELL", "REDISCLI_AUTH=\"$${REDIS_PASSWORD}\" redis-cli ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    volumes: ["srm-redis-data:/data"]
    networks: [srm-data]

  srm-redmine-db:
    image: postgres:16
    restart: unless-stopped
    env_file:
      - path: .runtime-env/srm-redmine-db.env
        format: raw
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 10s
      timeout: 5s
      retries: 20
    volumes: ["srm-redmine-db-data:/var/lib/postgresql/data"]
    networks: [srm-ticket]

  srm-redmine:
    image: redmine:6.0
    restart: unless-stopped
    depends_on:
      srm-redmine-db:
        condition: service_healthy
    env_file:
      - path: .runtime-env/srm-redmine.env
        format: raw
    volumes: ["srm-redmine-data:/usr/src/redmine/files"]
    networks: [srm-ticket]

  srm-auth:
    profiles: [apps]
    build:
      context: ..
      dockerfile: SRMAuth/Dockerfile
    image: srm-auth:local
    restart: unless-stopped
    depends_on:
      srm-sqlserver: { condition: service_healthy }
      srm-redis: { condition: service_healthy }
    env_file:
      - path: .runtime-env/srm-auth.env
        format: raw
    healthcheck: *dotnet-healthcheck
    networks: [srm-data, srm-services]

  srm-core:
    profiles: [apps]
    build:
      context: ..
      dockerfile: SRMCore/Dockerfile
    image: srm-core:local
    restart: unless-stopped
    depends_on:
      srm-sqlserver: { condition: service_healthy }
      srm-redis: { condition: service_healthy }
      srm-redmine: { condition: service_started }
    env_file:
      - path: .runtime-env/srm-core.env
        format: raw
    healthcheck: *dotnet-healthcheck
    networks: [srm-data, srm-services, srm-ticket]

  srm-app:
    profiles: [apps]
    build:
      context: ..
      dockerfile: SRMApp/Dockerfile
    image: srm-app:local
    restart: unless-stopped
    depends_on:
      srm-redis: { condition: service_healthy }
      srm-auth: { condition: service_healthy }
      srm-core: { condition: service_healthy }
    env_file:
      - path: .runtime-env/srm-app.env
        format: raw
    healthcheck: *dotnet-healthcheck
    networks: [srm-data, srm-services]

  srm-demo-seeder:
    profiles: [apps]
    build:
      context: ..
      dockerfile: SRMDemoSeeder/Dockerfile
    image: srm-demo-seeder:local
    restart: "no"
    depends_on:
      srm-auth: { condition: service_healthy }
      srm-core: { condition: service_healthy }
    env_file:
      - path: .runtime-env/srm-demo-seeder.env
        format: raw
    networks: [srm-data, srm-site]

  srm-agent:
    profiles: [apps]
    build:
      context: ..
      dockerfile: SRMAgent/Dockerfile
    image: srm-agent:local
    restart: unless-stopped
    depends_on:
      srm-auth: { condition: service_healthy }
      srm-core: { condition: service_healthy }
      srm-demo-seeder: { condition: service_completed_successfully }
    env_file:
      - path: .runtime-env/srm-agent.env
        format: raw
    healthcheck: *dotnet-healthcheck
    networks: [srm-services, srm-site]

  shelly1:
    profiles: [simulators]
    build: *shelly-build
    image: srm-shelly:local
    restart: unless-stopped
    networks: [srm-site]

  shelly2:
    profiles: [simulators]
    image: srm-shelly:local
    restart: unless-stopped
    networks: [srm-site]

  shelly3:
    profiles: [simulators]
    image: srm-shelly:local
    restart: unless-stopped
    networks: [srm-site]

volumes:
  srm-sqlserver-data:
  srm-redis-data:
  srm-redmine-db-data:
  srm-redmine-data:

networks:
  srm-data: {}
  srm-services: {}
  srm-ticket: {}
  srm-site: {}
