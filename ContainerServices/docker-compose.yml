name: srm

services:
  srm-sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: srm-sqlserver
    restart: unless-stopped
    ports:
      - "1433:1433"
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "${MSSQL_SA_PASSWORD}"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$${MSSQL_SA_PASSWORD}\" -C -Q \"SELECT 1\" || exit 1"
        ]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 20s
    volumes:
      - srm-sqlserver-data:/var/opt/mssql

  srm-redis:
    image: redis:7-alpine
    container_name: srm-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - srm-redis-data:/data

  srm-redmine-db:
    image: postgres:16
    container_name: srm-redmine-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: "${REDMINE_POSTGRES_DB}"
      POSTGRES_USER: "${REDMINE_POSTGRES_USER}"
      POSTGRES_PASSWORD: "${REDMINE_POSTGRES_PASSWORD}"
    volumes:
      - srm-redmine-db-data:/var/lib/postgresql/data

  shelly1:
    build:
      context: ../PythonShelly
      dockerfile: Dockerfile
    container_name: shelly1
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "5000:5000"

  shelly2:
    build:
      context: ../PythonShelly
      dockerfile: Dockerfile
    container_name: shelly2
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "5001:5000"

  shelly3:
    build:
      context: ../PythonShelly
      dockerfile: Dockerfile
    container_name: shelly3
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "5002:5000"

  srm-redmine:
    image: redmine:6.0
    container_name: srm-redmine
    restart: unless-stopped
    depends_on:
      - srm-redmine-db
    ports:
      - "3000:3000"
    environment:
      REDMINE_DB_POSTGRES: srm-redmine-db
      REDMINE_DB_DATABASE: "${REDMINE_POSTGRES_DB}"
      REDMINE_DB_USERNAME: "${REDMINE_POSTGRES_USER}"
      REDMINE_DB_PASSWORD: "${REDMINE_POSTGRES_PASSWORD}"
    volumes:
      - srm-redmine-data:/usr/src/redmine/files

