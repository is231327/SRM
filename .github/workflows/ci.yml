name: CI
run-name: CI build ${{ github.run_number }} · ${{ github.event.pull_request.head.sha || github.sha }}

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      MSSQL_SA_PASSWORD: "Aa9!Run-${{ github.run_id }}-${{ github.run_attempt }}"

    services:
      sqlserver:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: Y
          MSSQL_PID: Developer
          MSSQL_SA_PASSWORD: "Aa9!Run-${{ github.run_id }}-${{ github.run_attempt }}"
        ports:
          - "1433:1433"
        options: >-
          --health-cmd "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$MSSQL_SA_PASSWORD\" -C -Q \"SELECT 1\" || exit 1"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 20
          --health-start-period 30s

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate release commit messages
        shell: pwsh
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE_SHA: ${{ github.event.before }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          TARGET_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          $zeroSha = '0000000000000000000000000000000000000000'
          if ($env:EVENT_NAME -eq 'pull_request') {
            $range = "$env:BASE_SHA..$env:TARGET_SHA"
          }
          elseif (-not [string]::IsNullOrWhiteSpace($env:BEFORE_SHA) -and $env:BEFORE_SHA -ne $zeroSha) {
            $range = "$env:BEFORE_SHA..$env:TARGET_SHA"
          }
          else {
            $range = $env:TARGET_SHA
          }

          $commits = @(git rev-list --reverse $range)
          if ($LASTEXITCODE -ne 0 -or $commits.Count -eq 0) {
            throw "Could not resolve commits for $range."
          }

          foreach ($commit in $commits) {
            $subject = (git show --no-patch --format=%s $commit).Trim()
            if ($subject -notmatch '^fix(\([^)]+\))?:' -and
                $subject -notmatch '^feat(\([^)]+\))?:' -and
                $subject -notmatch '^[a-z][a-z0-9-]*(\([^)]+\))?!:') {
              throw "Commit $commit must start with fix:, feat:, or a Conventional Commit type followed by !:."
            }
          }

          "## CI build $env:GITHUB_RUN_NUMBER" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Encoding utf8 -Append
          "Validated $($commits.Count) commit message(s)." | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Encoding utf8 -Append

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Create ephemeral CI configuration
        shell: pwsh
        run: |
          $databaseSuffix = [Guid]::NewGuid().ToString('N')
          $connectionBase = "Server=localhost,1433;User Id=sa;Password=$env:MSSQL_SA_PASSWORD;TrustServerCertificate=True;Encrypt=False"
          "ConnectionStrings__SrmAuthDatabase=$connectionBase;Database=SrmCiAuth$databaseSuffix" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "ConnectionStrings__SrmCoreDatabase=$connectionBase;Database=SrmCiCore$databaseSuffix" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          ./ContainerServices/New-DeploymentConfiguration.ps1 -Name srm-ci

      - name: Restore
        run: dotnet restore SRM.sln

      - name: Build
        run: dotnet build SRM.sln --configuration Release --no-restore /p:ContinuousIntegrationBuild=true

      - name: Test
        run: dotnet test SRM.sln --configuration Release --no-build --verbosity normal

      - name: Validate Compose
        shell: pwsh
        run: |
          ./ContainerServices/Deployment-Local.ps1 -Mode Full -PrepareOnly
          Push-Location ContainerServices
          docker compose -f docker-compose.yml -f .runtime-env/docker-compose.runtime.yml --profile apps --profile simulators config --quiet
          Pop-Location

  container-builds:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: auth
            dockerfile: SRMAuth/Dockerfile
          - service: core
            dockerfile: SRMCore/Dockerfile
          - service: app
            dockerfile: SRMApp/Dockerfile
          - service: agent
            dockerfile: SRMAgent/Dockerfile
          - service: demo-seeder
            dockerfile: SRMDemoSeeder/Dockerfile
          - service: redmine
            dockerfile: SRMRedmine/Dockerfile

    steps:
      - uses: actions/checkout@v4
      - name: Build ${{ matrix.service }} image
        run: docker build --file "${{ matrix.dockerfile }}" --tag "srm-${{ matrix.service }}:ci" .
      - name: Validate Blazor framework asset
        if: matrix.service == 'app'
        run: docker run --rm --entrypoint test srm-app:ci -f /app/wwwroot/_framework/blazor.web.js
      - name: Validate Agent network dependency
        if: matrix.service == 'agent'
        run: docker run --rm --entrypoint sh srm-agent:ci -c 'command -v ping'
